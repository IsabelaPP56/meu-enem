<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img"><title>Uma expressão pode resumir um acontecimento e acrescentar perspectiva</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#7937bd"/></marker></defs><rect width="720" height="440" rx="18" fill="#faf7ff"/><g font-family="sans-serif"><text x="123" y="40" font-size="23" fill="#342646">Referenciação: acontecimento e avaliação</text><rect x="35" y="75" width="650" height="92" rx="12" fill="#eee5ff" stroke="#7937bd" stroke-width="2"/><text x="55" y="110" font-size="23" fill="#342646">O grupo transformou o terreno em jardim.</text><text x="55" y="145" font-size="23" fill="#342646">Essa iniciativa aproximou os moradores.</text><path d="M126,190 L126,245" stroke="#7937bd" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="35" y="255" width="650" height="108" rx="12" fill="#eee5ff" stroke="#7937bd" stroke-width="2"/><text x="55" y="291" font-size="21" fill="#342646">“Essa iniciativa” retoma a transformação inteira.</text><text x="55" y="328" font-size="21" fill="#342646">A expressão também enquadra a ação.</text><text x="65" y="413" font-size="21" fill="#342646">O referente não é apenas o substantivo mais próximo.</text></g></svg>