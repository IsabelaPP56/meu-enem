<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img"><title>Cinco perguntas para a crítica de fontes históricas</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#7937bd"/></marker></defs><rect width="720" height="440" rx="18" fill="#faf7ff"/><g font-family="sans-serif"><text x="360" y="38" font-size="23" fill="#342646" text-anchor="middle">Crítica de fontes: cinco perguntas</text><rect x="270" y="170" width="180" height="80" rx="12" fill="#eee5ff" stroke="#7937bd" stroke-width="2"/><text x="360" y="205" font-size="22" fill="#7937bd" text-anchor="middle">FONTE</text><text x="360" y="232" font-size="13" fill="#342646" text-anchor="middle">documento, objeto, relato</text><rect x="10" y="67" width="200" height="46" rx="12" fill="#ffffff" stroke="#7937bd" stroke-width="2"/><text x="110" y="97" font-size="16" fill="#342646" text-anchor="middle">Quem produziu?</text><path d="M110,113 L285.0,170" stroke="#7937bd" stroke-width="2" fill="none" /><rect x="510" y="67" width="200" height="46" rx="12" fill="#ffffff" stroke="#7937bd" stroke-width="2"/><text x="610" y="97" font-size="16" fill="#342646" text-anchor="middle">Quando e onde?</text><path d="M610,113 L435.0,170" stroke="#7937bd" stroke-width="2" fill="none" /><rect x="10" y="292" width="200" height="46" rx="12" fill="#ffffff" stroke="#7937bd" stroke-width="2"/><text x="110" y="322" font-size="16" fill="#342646" text-anchor="middle">Para quem?</text><path d="M110,292 L285.0,250" stroke="#7937bd" stroke-width="2" fill="none" /><rect x="510" y="292" width="200" height="46" rx="12" fill="#ffffff" stroke="#7937bd" stroke-width="2"/><text x="610" y="322" font-size="16" fill="#342646" text-anchor="middle">Com qual objetivo?</text><path d="M610,292 L435.0,250" stroke="#7937bd" stroke-width="2" fill="none" /><rect x="260" y="357" width="200" height="46" rx="12" fill="#ffffff" stroke="#7937bd" stroke-width="2"/><text x="360" y="387" font-size="16" fill="#342646" text-anchor="middle">O que omite ou silencia?</text><path d="M360,357 L360.0,250" stroke="#7937bd" stroke-width="2" fill="none" /></g></svg>