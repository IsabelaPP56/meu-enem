<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img"><title>Cadeias de conversão de energia em usinas hidrelétrica e nuclear</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#7937bd"/></marker></defs><rect width="720" height="440" rx="18" fill="#faf7ff"/><g font-family="sans-serif"><text x="360" y="38" font-size="23" fill="#342646" text-anchor="middle">Cadeias de conversão: energia não é criada</text><text x="40" y="96" font-size="20" fill="#7937bd" text-anchor="start">Hidrelétrica</text><rect x="30" y="108" width="150" height="62" rx="12" fill="#eee5ff" stroke="#7937bd" stroke-width="2"/><text x="105" y="145" font-size="15" fill="#342646" text-anchor="middle">Potencial da água</text><path d="M180,139 L202,139" stroke="#7937bd" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="202" y="108" width="150" height="62" rx="12" fill="#eee5ff" stroke="#7937bd" stroke-width="2"/><text x="277" y="145" font-size="15" fill="#342646" text-anchor="middle">Cinética</text><path d="M352,139 L374,139" stroke="#7937bd" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="374" y="108" width="150" height="62" rx="12" fill="#eee5ff" stroke="#7937bd" stroke-width="2"/><text x="449" y="145" font-size="15" fill="#342646" text-anchor="middle">Rotação da turbina</text><path d="M524,139 L546,139" stroke="#7937bd" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="546" y="108" width="150" height="62" rx="12" fill="#eee5ff" stroke="#7937bd" stroke-width="2"/><text x="621" y="145" font-size="15" fill="#342646" text-anchor="middle">Elétrica (indução)</text><text x="40" y="246" font-size="20" fill="#7937bd" text-anchor="start">Nuclear</text><rect x="30" y="258" width="150" height="62" rx="12" fill="#eee5ff" stroke="#7937bd" stroke-width="2"/><text x="105" y="295" font-size="15" fill="#342646" text-anchor="middle">Nuclear (fissão)</text><path d="M180,289 L202,289" stroke="#7937bd" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="202" y="258" width="150" height="62" rx="12" fill="#eee5ff" stroke="#7937bd" stroke-width="2"/><text x="277" y="295" font-size="15" fill="#342646" text-anchor="middle">Térmica (vapor)</text><path d="M352,289 L374,289" stroke="#7937bd" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="374" y="258" width="150" height="62" rx="12" fill="#eee5ff" stroke="#7937bd" stroke-width="2"/><text x="449" y="295" font-size="15" fill="#342646" text-anchor="middle">Rotação da turbina</text><path d="M524,289 L546,289" stroke="#7937bd" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="546" y="258" width="150" height="62" rx="12" fill="#eee5ff" stroke="#7937bd" stroke-width="2"/><text x="621" y="295" font-size="15" fill="#342646" text-anchor="middle">Elétrica (indução)</text><text x="360" y="395" font-size="18" fill="#342646" text-anchor="middle">Em cada etapa parte da energia vira calor não aproveitado.</text><text x="360" y="422" font-size="17" fill="#342646" text-anchor="middle">Rendimento η = útil/total &lt; 100%. Esquema autoral.</text></g></svg>