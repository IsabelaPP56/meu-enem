<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img"><title>Três momentos do Modernismo brasileiro</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#7937bd"/></marker></defs><rect width="720" height="440" rx="18" fill="#faf7ff"/><g font-family="sans-serif"><text x="360" y="38" font-size="23" fill="#342646" text-anchor="middle">Modernismo brasileiro: três momentos</text><rect x="25" y="80" width="210" height="220" rx="12" fill="#eee5ff" stroke="#7937bd" stroke-width="2"/><text x="130" y="115" font-size="18" fill="#7937bd" text-anchor="middle">1922-1930</text><text x="130" y="155" font-size="16" fill="#342646" text-anchor="middle">1ª fase: ruptura</text><text x="130" y="200" font-size="14" fill="#342646" text-anchor="middle">Semana de 22, verso livre,</text><text x="130" y="225" font-size="14" fill="#342646" text-anchor="middle">paródia, Antropofagia</text><path d="M235,190 L260,190" stroke="#7937bd" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="260" y="80" width="210" height="220" rx="12" fill="#ffe9d6" stroke="#7937bd" stroke-width="2"/><text x="365" y="115" font-size="18" fill="#7937bd" text-anchor="middle">1930-1945</text><text x="365" y="155" font-size="16" fill="#342646" text-anchor="middle">2ª fase: consolidação</text><text x="365" y="200" font-size="14" fill="#342646" text-anchor="middle">poesia social e existencial,</text><text x="365" y="225" font-size="14" fill="#342646" text-anchor="middle">Romance de 30</text><path d="M470,190 L495,190" stroke="#7937bd" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="495" y="80" width="210" height="220" rx="12" fill="#e3f1ff" stroke="#7937bd" stroke-width="2"/><text x="600" y="115" font-size="18" fill="#7937bd" text-anchor="middle">1945 em diante</text><text x="600" y="155" font-size="16" fill="#342646" text-anchor="middle">3ª fase: invenção</text><text x="600" y="200" font-size="14" fill="#342646" text-anchor="middle">João Cabral, Clarice,</text><text x="600" y="225" font-size="14" fill="#342646" text-anchor="middle">Guimarães Rosa</text><text x="360" y="345" font-size="16" fill="#342646" text-anchor="middle">Cada fase retoma e transforma as conquistas da anterior.</text><text x="360" y="405" font-size="15" fill="#342646" text-anchor="middle">Esquema autoral.</text></g></svg>