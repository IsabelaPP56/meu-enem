<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img"><title>Comparação entre os blocos capitalista e socialista na Guerra Fria</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#7937bd"/></marker></defs><rect width="720" height="440" rx="18" fill="#faf7ff"/><g font-family="sans-serif"><text x="360" y="38" font-size="23" fill="#342646" text-anchor="middle">Guerra Fria: dois blocos, conflitos indiretos</text><rect x="30" y="70" width="300" height="230" rx="12" fill="#e3f1ff" stroke="#7937bd" stroke-width="2"/><text x="180" y="104" font-size="20" fill="#1d4f91" text-anchor="middle">Bloco capitalista</text><text x="180" y="150" font-size="16" fill="#342646" text-anchor="middle">EUA · Otan (1949)</text><text x="180" y="185" font-size="16" fill="#342646" text-anchor="middle">Plano Marshall</text><text x="180" y="220" font-size="16" fill="#342646" text-anchor="middle">Doutrina Truman</text><text x="180" y="255" font-size="16" fill="#342646" text-anchor="middle">livre mercado</text><rect x="390" y="70" width="300" height="230" rx="12" fill="#ffdede" stroke="#7937bd" stroke-width="2"/><text x="540" y="104" font-size="20" fill="#912d1d" text-anchor="middle">Bloco socialista</text><text x="540" y="150" font-size="16" fill="#342646" text-anchor="middle">URSS · Pacto de Varsóvia (1955)</text><text x="540" y="185" font-size="16" fill="#342646" text-anchor="middle">Comecon</text><text x="540" y="220" font-size="16" fill="#342646" text-anchor="middle">partido único</text><text x="540" y="255" font-size="16" fill="#342646" text-anchor="middle">planificação estatal</text><text x="360" y="190" font-size="40" fill="#7937bd" text-anchor="middle">×</text><text x="360" y="340" font-size="16" fill="#342646" text-anchor="middle">Conflitos indiretos: Coreia · Vietnã · Cuba (1962) · Afeganistão</text><text x="360" y="372" font-size="16" fill="#342646" text-anchor="middle">1947 → 1989 queda do Muro → 1991 fim da URSS</text><text x="360" y="405" font-size="15" fill="#342646" text-anchor="middle">Esquema autoral.</text></g></svg>