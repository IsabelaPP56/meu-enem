<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img"><title>Comparação entre Hobbes, Locke e Rousseau</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#7937bd"/></marker></defs><rect width="720" height="440" rx="18" fill="#faf7ff"/><g font-family="sans-serif"><text x="360" y="38" font-size="23" fill="#342646" text-anchor="middle">Contratualistas: três respostas</text><text x="150" y="90" font-size="16" fill="#7937bd" text-anchor="middle">Autor</text><text x="370" y="90" font-size="16" fill="#7937bd" text-anchor="middle">Estado de natureza</text><text x="590" y="90" font-size="16" fill="#7937bd" text-anchor="middle">Contrato e poder</text><rect x="60" y="110" width="180" height="60" rx="12" fill="#eee5ff" stroke="#7937bd" stroke-width="2"/><rect x="270" y="110" width="200" height="60" rx="12" fill="#ffe9d6" stroke="#7937bd" stroke-width="2"/><rect x="490" y="110" width="200" height="60" rx="12" fill="#e3f1ff" stroke="#7937bd" stroke-width="2"/><text x="150" y="146" font-size="17" fill="#342646" text-anchor="middle">Hobbes</text><text x="370" y="146" font-size="15" fill="#342646" text-anchor="middle">guerra de todos</text><text x="590" y="146" font-size="15" fill="#342646" text-anchor="middle">soberano absoluto</text><rect x="60" y="190" width="180" height="60" rx="12" fill="#eee5ff" stroke="#7937bd" stroke-width="2"/><rect x="270" y="190" width="200" height="60" rx="12" fill="#ffe9d6" stroke="#7937bd" stroke-width="2"/><rect x="490" y="190" width="200" height="60" rx="12" fill="#e3f1ff" stroke="#7937bd" stroke-width="2"/><text x="150" y="226" font-size="17" fill="#342646" text-anchor="middle">Locke</text><text x="370" y="226" font-size="15" fill="#342646" text-anchor="middle">direitos naturais</text><text x="590" y="226" font-size="15" fill="#342646" text-anchor="middle">governo limitado</text><rect x="60" y="270" width="180" height="60" rx="12" fill="#eee5ff" stroke="#7937bd" stroke-width="2"/><rect x="270" y="270" width="200" height="60" rx="12" fill="#ffe9d6" stroke="#7937bd" stroke-width="2"/><rect x="490" y="270" width="200" height="60" rx="12" fill="#e3f1ff" stroke="#7937bd" stroke-width="2"/><text x="150" y="306" font-size="17" fill="#342646" text-anchor="middle">Rousseau</text><text x="370" y="306" font-size="15" fill="#342646" text-anchor="middle">bondade natural</text><text x="590" y="306" font-size="15" fill="#342646" text-anchor="middle">vontade geral</text><text x="360" y="375" font-size="15" fill="#342646" text-anchor="middle">Compare: como era sem Estado, por que contratar e quais limites o poder tem.</text><text x="360" y="410" font-size="15" fill="#342646" text-anchor="middle">Esquema autoral.</text></g></svg>