<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img"><title>Comparação entre conceitos centrais de Durkheim, Weber e Marx</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#7937bd"/></marker></defs><rect width="720" height="440" rx="18" fill="#faf7ff"/><g font-family="sans-serif"><text x="360" y="38" font-size="23" fill="#342646" text-anchor="middle">Três chaves clássicas da Sociologia</text><rect x="30" y="70" width="204" height="250" rx="12" fill="#ffffff" stroke="#7937bd" stroke-width="2"/><text x="132" y="104" font-size="21" fill="#7937bd" text-anchor="middle">Durkheim</text><text x="132" y="150" font-size="17" fill="#342646" text-anchor="middle">fato social</text><text x="132" y="190" font-size="17" fill="#342646" text-anchor="middle">coerção e normas</text><text x="132" y="230" font-size="17" fill="#342646" text-anchor="middle">solidariedade</text><text x="132" y="270" font-size="17" fill="#342646" text-anchor="middle">anomia</text><rect x="258" y="70" width="204" height="250" rx="12" fill="#ffffff" stroke="#7937bd" stroke-width="2"/><text x="360" y="104" font-size="21" fill="#7937bd" text-anchor="middle">Weber</text><text x="360" y="150" font-size="17" fill="#342646" text-anchor="middle">ação social</text><text x="360" y="190" font-size="17" fill="#342646" text-anchor="middle">sentido do agente</text><text x="360" y="230" font-size="17" fill="#342646" text-anchor="middle">racionalização</text><text x="360" y="270" font-size="17" fill="#342646" text-anchor="middle">dominação</text><rect x="486" y="70" width="204" height="250" rx="12" fill="#ffffff" stroke="#7937bd" stroke-width="2"/><text x="588" y="104" font-size="21" fill="#7937bd" text-anchor="middle">Marx</text><text x="588" y="150" font-size="17" fill="#342646" text-anchor="middle">modo de produção</text><text x="588" y="190" font-size="17" fill="#342646" text-anchor="middle">classes e conflito</text><text x="588" y="230" font-size="17" fill="#342646" text-anchor="middle">mais-valia</text><text x="588" y="270" font-size="17" fill="#342646" text-anchor="middle">alienação, ideologia</text><text x="360" y="365" font-size="16" fill="#342646" text-anchor="middle">Pergunta-guia: o texto destaca norma, sentido da ação ou conflito material?</text><text x="360" y="400" font-size="15" fill="#342646" text-anchor="middle">Esquema autoral; os autores não se reduzem a quatro palavras.</text></g></svg>