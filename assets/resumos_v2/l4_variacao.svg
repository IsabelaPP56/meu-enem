<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img"><title>Quatro eixos de variação sem hierarquia natural entre os falantes</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#7937bd"/></marker></defs><rect width="720" height="440" rx="18" fill="#faf7ff"/><g font-family="sans-serif"><text x="130" y="40" font-size="24" fill="#342646">Variação: eixos que podem se cruzar</text><rect x="35" y="80" width="300" height="110" rx="12" fill="#eee5ff" stroke="#7937bd" stroke-width="2"/><text x="53" y="118" font-size="24" fill="#342646">Regional</text><text x="53" y="157" font-size="19" fill="#342646">Espaços e comunidades</text><rect x="385" y="80" width="300" height="110" rx="12" fill="#eee5ff" stroke="#7937bd" stroke-width="2"/><text x="403" y="118" font-size="24" fill="#342646">Social</text><text x="403" y="157" font-size="19" fill="#342646">Grupos e trajetórias</text><rect x="35" y="215" width="300" height="110" rx="12" fill="#eee5ff" stroke="#7937bd" stroke-width="2"/><text x="53" y="253" font-size="24" fill="#342646">Histórica</text><text x="53" y="292" font-size="19" fill="#342646">Transformações no tempo</text><rect x="385" y="215" width="300" height="110" rx="12" fill="#eee5ff" stroke="#7937bd" stroke-width="2"/><text x="403" y="253" font-size="24" fill="#342646">Situacional</text><text x="403" y="292" font-size="19" fill="#342646">Interlocutor e finalidade</text><text x="79" y="385" font-size="22" fill="#342646">A mesma pessoa mobiliza diferentes repertórios.</text><text x="99" y="420" font-size="21" fill="#342646">Diferença não mede inteligência nem dignidade.</text></g></svg>