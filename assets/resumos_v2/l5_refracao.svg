<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img"><title>Raio de luz passando do ar para a água e aproximando-se da normal</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#7937bd"/></marker></defs><rect width="720" height="440" rx="18" fill="#faf7ff"/><g font-family="sans-serif"><text x="360" y="38" font-size="23" fill="#342646" text-anchor="middle">Refração: medir ângulos pela normal</text><rect x="40" y="220" width="640" height="170" fill="#dcecff"/><path d="M40,220 L680,220" stroke="#342646" stroke-width="2" fill="none" /><path d="M360,70 L360,390" stroke="#9b8bb0" stroke-width="2" fill="none" stroke-dasharray="6 6"/><text x="370" y="88" font-size="16" fill="#6b5a80" text-anchor="start">normal</text><path d="M220,80 L360,220" stroke="#7937bd" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M360,220 L430,375" stroke="#7937bd" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="70" y="200" font-size="18" fill="#342646" text-anchor="start">ar · n₁ menor</text><text x="70" y="250" font-size="18" fill="#342646" text-anchor="start">água · n₂ maior</text><text x="270" y="120" font-size="20" fill="#342646" text-anchor="start">θ₁</text><text x="395" y="300" font-size="18" fill="#342646" text-anchor="start">θ₂ menor</text><rect x="80" y="400" width="560" height="30" rx="12" fill="#faf7ff" stroke="#faf7ff" stroke-width="2"/><text x="360" y="420" font-size="15" fill="#342646" text-anchor="middle">n₁·senθ₁ = n₂·senθ₂ · ao entrar em meio de n maior, aproxima-se da normal</text></g></svg>