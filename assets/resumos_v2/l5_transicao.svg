<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img"><title>Curvas esquemáticas de natalidade e mortalidade nas quatro fases da transição demográfica</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#7937bd"/></marker></defs><rect width="720" height="440" rx="18" fill="#faf7ff"/><g font-family="sans-serif"><text x="360" y="38" font-size="23" fill="#342646" text-anchor="middle">Transição demográfica (modelo, sem escala)</text><path d="M70,330 L680,330" stroke="#342646" stroke-width="3" fill="none" /><path d="M70,330 L70,70" stroke="#342646" stroke-width="3" fill="none" /><polyline points="70,110 230,108 330,150 450,250 560,280 670,285" fill="none" stroke="#7937bd" stroke-width="4"/><polyline points="70,120 180,200 300,255 450,270 560,280 670,282" fill="none" stroke="#e07a1f" stroke-width="4" stroke-dasharray="10 6"/><text x="150" y="360" font-size="17" fill="#342646" text-anchor="middle">Fase 1</text><text x="300" y="360" font-size="17" fill="#342646" text-anchor="middle">Fase 2</text><text x="450" y="360" font-size="17" fill="#342646" text-anchor="middle">Fase 3</text><text x="610" y="360" font-size="17" fill="#342646" text-anchor="middle">Fase 4</text><text x="470" y="190" font-size="18" fill="#7937bd" text-anchor="start">natalidade</text><text x="150" y="240" font-size="18" fill="#e07a1f" text-anchor="start">mortalidade</text><text x="75" y="62" font-size="16" fill="#342646" text-anchor="start">taxas</text><text x="360" y="395" font-size="17" fill="#342646" text-anchor="middle">O intervalo entre as curvas indica o crescimento vegetativo.</text><text x="360" y="422" font-size="17" fill="#342646" text-anchor="middle">Mortalidade cai primeiro; natalidade cai depois. Esquema autoral.</text></g></svg>