<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img"><title>Sequência aproximada dos estilos de época da literatura no Brasil</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#7937bd"/></marker></defs><rect width="720" height="440" rx="18" fill="#faf7ff"/><g font-family="sans-serif"><text x="360" y="38" font-size="22" fill="#342646" text-anchor="middle">Literatura no Brasil: estilos de época (datas aproximadas)</text><rect x="20" y="80" width="128" height="80" rx="12" fill="#eee5ff" stroke="#7937bd" stroke-width="2"/><text x="84" y="115" font-size="15" fill="#342646" text-anchor="middle">Quinhentismo</text><text x="84" y="140" font-size="14" fill="#7937bd" text-anchor="middle">séc. XVI</text><path d="M148,120 L160,120" stroke="#7937bd" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="160" y="80" width="128" height="80" rx="12" fill="#eee5ff" stroke="#7937bd" stroke-width="2"/><text x="224" y="115" font-size="15" fill="#342646" text-anchor="middle">Barroco</text><text x="224" y="140" font-size="14" fill="#7937bd" text-anchor="middle">séc. XVII</text><path d="M288,120 L300,120" stroke="#7937bd" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="300" y="80" width="128" height="80" rx="12" fill="#eee5ff" stroke="#7937bd" stroke-width="2"/><text x="364" y="115" font-size="15" fill="#342646" text-anchor="middle">Arcadismo</text><text x="364" y="140" font-size="14" fill="#7937bd" text-anchor="middle">séc. XVIII</text><path d="M428,120 L440,120" stroke="#7937bd" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="440" y="80" width="128" height="80" rx="12" fill="#eee5ff" stroke="#7937bd" stroke-width="2"/><text x="504" y="115" font-size="15" fill="#342646" text-anchor="middle">Romantismo</text><text x="504" y="140" font-size="14" fill="#7937bd" text-anchor="middle">1836</text><path d="M568,120 L580,120" stroke="#7937bd" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="580" y="80" width="128" height="80" rx="12" fill="#eee5ff" stroke="#7937bd" stroke-width="2"/><text x="644" y="115" font-size="15" fill="#342646" text-anchor="middle">Realismo/Natur.</text><text x="644" y="140" font-size="14" fill="#7937bd" text-anchor="middle">1881</text><rect x="20" y="230" width="128" height="80" rx="12" fill="#ffe9d6" stroke="#7937bd" stroke-width="2"/><text x="84" y="265" font-size="15" fill="#342646" text-anchor="middle">Parnas./Simbol.</text><text x="84" y="290" font-size="14" fill="#7937bd" text-anchor="middle">fim séc. XIX</text><path d="M148,270 L160,270" stroke="#7937bd" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="160" y="230" width="128" height="80" rx="12" fill="#ffe9d6" stroke="#7937bd" stroke-width="2"/><text x="224" y="265" font-size="15" fill="#342646" text-anchor="middle">Pré-Modernismo</text><text x="224" y="290" font-size="14" fill="#7937bd" text-anchor="middle">1902-1922</text><path d="M288,270 L300,270" stroke="#7937bd" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="300" y="230" width="128" height="80" rx="12" fill="#ffe9d6" stroke="#7937bd" stroke-width="2"/><text x="364" y="265" font-size="15" fill="#342646" text-anchor="middle">Modernismo</text><text x="364" y="290" font-size="14" fill="#7937bd" text-anchor="middle">1922</text><path d="M428,270 L440,270" stroke="#7937bd" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="440" y="230" width="128" height="80" rx="12" fill="#ffe9d6" stroke="#7937bd" stroke-width="2"/><text x="504" y="265" font-size="15" fill="#342646" text-anchor="middle">Pós-1945</text><text x="504" y="290" font-size="14" fill="#7937bd" text-anchor="middle">1945</text><path d="M568,270 L580,270" stroke="#7937bd" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="580" y="230" width="128" height="80" rx="12" fill="#ffe9d6" stroke="#7937bd" stroke-width="2"/><text x="644" y="265" font-size="15" fill="#342646" text-anchor="middle">Contemporânea</text><text x="644" y="290" font-size="14" fill="#7937bd" text-anchor="middle">pós-1960</text><path d="M660,160 L660,180" stroke="#7937bd" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M660,180 L84,200" stroke="#7937bd" stroke-width="2" fill="none" /><path d="M84,200 L84,230" stroke="#7937bd" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="360" y="370" font-size="15" fill="#342646" text-anchor="middle">Estilos se sobrepõem; a classificação é hipótese a confirmar nas marcas do texto.</text><text x="360" y="405" font-size="15" fill="#342646" text-anchor="middle">Esquema autoral.</text></g></svg>