<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img"><title>Períodos aproximados da filosofia ocidental</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#7937bd"/></marker></defs><rect width="720" height="440" rx="18" fill="#faf7ff"/><g font-family="sans-serif"><text x="360" y="38" font-size="22" fill="#342646" text-anchor="middle">Períodos da filosofia ocidental (aproximados)</text><path d="M40,200 L680,200" stroke="#342646" stroke-width="4" fill="none" /><rect x="40" y="185" width="160" height="30" fill="#eee5ff" stroke="#7937bd" stroke-width="1.5"/><text x="120.0" y="120" font-size="18" fill="#342646" text-anchor="middle">Antiga</text><text x="120.0" y="150" font-size="13" fill="#7937bd" text-anchor="middle">séc. VI a.C.-V d.C.</text><text x="120.0" y="250" font-size="13" fill="#342646" text-anchor="middle">pré-socráticos, Platão</text><rect x="200" y="185" width="160" height="30" fill="#ffe9d6" stroke="#7937bd" stroke-width="1.5"/><text x="280.0" y="120" font-size="18" fill="#342646" text-anchor="middle">Medieval</text><text x="280.0" y="150" font-size="13" fill="#7937bd" text-anchor="middle">séc. V-XV</text><text x="280.0" y="250" font-size="13" fill="#342646" text-anchor="middle">Agostinho, Tomás</text><rect x="360" y="185" width="160" height="30" fill="#e3f1ff" stroke="#7937bd" stroke-width="1.5"/><text x="440.0" y="120" font-size="18" fill="#342646" text-anchor="middle">Moderna</text><text x="440.0" y="150" font-size="13" fill="#7937bd" text-anchor="middle">séc. XVII-XVIII</text><text x="440.0" y="250" font-size="13" fill="#342646" text-anchor="middle">Descartes, Hume, Kant</text><rect x="520" y="185" width="160" height="30" fill="#e8f7e8" stroke="#7937bd" stroke-width="1.5"/><text x="600.0" y="120" font-size="18" fill="#342646" text-anchor="middle">Contemporânea</text><text x="600.0" y="150" font-size="13" fill="#7937bd" text-anchor="middle">séc. XIX-XXI</text><text x="600.0" y="250" font-size="13" fill="#342646" text-anchor="middle">Nietzsche, Sartre, Arendt</text><text x="360" y="320" font-size="14" fill="#342646" text-anchor="middle">Problemas centrais: natureza e pólis → fé e razão → conhecimento → crítica da razão,</text><text x="360" y="342" font-size="14" fill="#342646" text-anchor="middle">existência e poder.</text><text x="360" y="405" font-size="15" fill="#342646" text-anchor="middle">Larguras iguais, sem escala. Esquema autoral.</text></g></svg>