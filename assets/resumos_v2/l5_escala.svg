<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img"><title>Conversão de escala cartográfica um para cem mil e fusos horários de quinze graus por hora</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#7937bd"/></marker></defs><rect width="720" height="440" rx="18" fill="#faf7ff"/><g font-family="sans-serif"><text x="360" y="38" font-size="23" fill="#342646" text-anchor="middle">Escala e fusos: duas conversões frequentes</text><rect x="30" y="70" width="320" height="280" rx="12" fill="#ffffff" stroke="#7937bd" stroke-width="2"/><text x="190" y="104" font-size="20" fill="#342646" text-anchor="middle">Escala 1:100 000</text><text x="190" y="150" font-size="19" fill="#342646" text-anchor="middle">1 cm no mapa</text><text x="190" y="180" font-size="19" fill="#342646" text-anchor="middle">= 100 000 cm reais</text><text x="190" y="210" font-size="19" fill="#342646" text-anchor="middle">= 1 km</text><rect x="60" y="250" width="52" height="16" fill="#342646" stroke="#342646"/><rect x="112" y="250" width="52" height="16" fill="#fff" stroke="#342646"/><rect x="164" y="250" width="52" height="16" fill="#342646" stroke="#342646"/><rect x="216" y="250" width="52" height="16" fill="#fff" stroke="#342646"/><rect x="268" y="250" width="52" height="16" fill="#342646" stroke="#342646"/><text x="60" y="295" font-size="15" fill="#342646" text-anchor="start">0</text><text x="320" y="295" font-size="15" fill="#342646" text-anchor="end">5 km</text><text x="190" y="330" font-size="16" fill="#342646" text-anchor="middle">Denominador maior = escala menor</text><rect x="370" y="70" width="320" height="280" rx="12" fill="#ffffff" stroke="#7937bd" stroke-width="2"/><text x="530" y="104" font-size="20" fill="#342646" text-anchor="middle">Fusos teóricos</text><text x="530" y="150" font-size="19" fill="#342646" text-anchor="middle">360° em 24 h</text><text x="530" y="180" font-size="19" fill="#342646" text-anchor="middle">15° = 1 hora</text><path d="M420,240 L640,240" stroke="#7937bd" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="530" y="228" font-size="16" fill="#342646" text-anchor="middle">para leste: horário adiantado</text><text x="530" y="290" font-size="17" fill="#342646" text-anchor="middle">45° O e 15° L: 60° = 4 h</text><text x="530" y="330" font-size="15" fill="#342646" text-anchor="middle">Fusos oficiais seguem limites políticos</text><text x="360" y="400" font-size="18" fill="#342646" text-anchor="middle">Exemplos autorais; confira o enunciado e a escala gráfica.</text></g></svg>