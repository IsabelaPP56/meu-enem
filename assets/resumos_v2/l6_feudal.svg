<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img"><title>Pirâmide das três ordens da sociedade feudal com obrigações servis</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#7937bd"/></marker></defs><rect width="720" height="440" rx="18" fill="#faf7ff"/><g font-family="sans-serif"><text x="360" y="38" font-size="23" fill="#342646" text-anchor="middle">Sociedade feudal: ordens e obrigações</text><polygon points="360,70 470,170 250,170" fill="#eee5ff" stroke="#7937bd" stroke-width="2"/><text x="360" y="152" font-size="14" fill="#342646" text-anchor="middle">Clero: os que oram</text><polygon points="250,170 470,170 560,260 160,260" fill="#ffe9d6" stroke="#7937bd" stroke-width="2"/><text x="360" y="222" font-size="17" fill="#342646" text-anchor="middle">Nobreza: os que guerreiam</text><polygon points="160,260 560,260 650,350 70,350" fill="#e3f1ff" stroke="#7937bd" stroke-width="2"/><text x="360" y="312" font-size="17" fill="#342646" text-anchor="middle">Camponeses e servos: os que trabalham</text><text x="600" y="120" font-size="15" fill="#7937bd" text-anchor="start">Vassalagem:</text><text x="600" y="140" font-size="14" fill="#342646" text-anchor="start">feudo ↔ fidelidade</text><text x="30" y="180" font-size="15" fill="#7937bd" text-anchor="start">Servos devem:</text><text x="30" y="200" font-size="14" fill="#342646" text-anchor="start">corveia, talha,</text><text x="30" y="218" font-size="14" fill="#342646" text-anchor="start">banalidades</text><text x="360" y="395" font-size="15" fill="#342646" text-anchor="middle">Modelo ideal elaborado por clérigos para legitimar a hierarquia; a realidade variava.</text><text x="360" y="420" font-size="15" fill="#342646" text-anchor="middle">Esquema autoral.</text></g></svg>