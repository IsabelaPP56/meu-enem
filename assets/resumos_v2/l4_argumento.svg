<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img"><title>Concessão reconhece um ponto e organiza sua relação com a tese defendida</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#7937bd"/></marker></defs><rect width="720" height="440" rx="18" fill="#faf7ff"/><g font-family="sans-serif"><text x="142" y="40" font-size="24" fill="#342646">Argumentação: concessão e orientação</text><rect x="35" y="75" width="650" height="88" rx="12" fill="#eee5ff" stroke="#7937bd" stroke-width="2"/><text x="55" y="108" font-size="22" fill="#342646">Embora haja catálogo digital...</text><text x="55" y="139" font-size="20" fill="#342646">Reconhece uma possibilidade da ferramenta.</text><rect x="35" y="183" width="650" height="88" rx="12" fill="#eee5ff" stroke="#7937bd" stroke-width="2"/><text x="55" y="216" font-size="22" fill="#342646">...o atendimento precisa continuar.</text><text x="55" y="247" font-size="20" fill="#342646">Defende a posição principal.</text><rect x="35" y="291" width="650" height="88" rx="12" fill="#eee5ff" stroke="#7937bd" stroke-width="2"/><text x="55" y="324" font-size="22" fill="#342646">Há usuários sem conexão ou orientação.</text><text x="55" y="355" font-size="20" fill="#342646">Oferece razões para a posição.</text><text x="90" y="418" font-size="19" fill="#342646">Conceder um ponto não é aceitar uma tese integralmente.</text></g></svg>