<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img"><title>Racionalismo, empirismo e a síntese kantiana</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#7937bd"/></marker></defs><rect width="720" height="440" rx="18" fill="#faf7ff"/><g font-family="sans-serif"><text x="360" y="38" font-size="23" fill="#342646" text-anchor="middle">De onde vem o conhecimento?</text><rect x="30" y="80" width="280" height="140" rx="12" fill="#eee5ff" stroke="#7937bd" stroke-width="2"/><text x="170" y="115" font-size="17" fill="#342646" text-anchor="middle">Racionalismo (Descartes)</text><text x="170" y="150" font-size="15" fill="#342646" text-anchor="middle">razão, dúvida metódica,</text><text x="170" y="175" font-size="15" fill="#342646" text-anchor="middle">ideias inatas, dedução</text><rect x="410" y="80" width="280" height="140" rx="12" fill="#ffe9d6" stroke="#7937bd" stroke-width="2"/><text x="550" y="115" font-size="17" fill="#342646" text-anchor="middle">Empirismo (Locke, Hume)</text><text x="550" y="150" font-size="15" fill="#342646" text-anchor="middle">experiência, tábula rasa,</text><text x="550" y="175" font-size="15" fill="#342646" text-anchor="middle">indução, causa como hábito</text><path d="M170,220 L330,280" stroke="#7937bd" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M550,220 L390,280" stroke="#7937bd" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="200" y="280" width="320" height="90" rx="12" fill="#e3f1ff" stroke="#7937bd" stroke-width="2"/><text x="360" y="312" font-size="17" fill="#342646" text-anchor="middle">Kant: síntese</text><text x="360" y="340" font-size="14" fill="#342646" text-anchor="middle">começa na experiência, organizada</text><text x="360" y="360" font-size="14" fill="#342646" text-anchor="middle">pelas formas do sujeito</text><text x="360" y="415" font-size="15" fill="#342646" text-anchor="middle">Esquema autoral.</text></g></svg>