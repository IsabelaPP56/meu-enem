<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img"><title>Linha do tempo dos períodos políticos do Brasil de 1500 a 1988</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#7937bd"/></marker></defs><rect width="720" height="440" rx="18" fill="#faf7ff"/><g font-family="sans-serif"><text x="360" y="38" font-size="23" fill="#342646" text-anchor="middle">Brasil: grandes períodos políticos (1500-1988)</text><path d="M40,200 L680,200" stroke="#342646" stroke-width="4" fill="none" /><rect x="40" y="185" width="210" height="30" fill="#eee5ff" stroke="#7937bd" stroke-width="1.5"/><path d="M145.0,170 L145.0,185" stroke="#7937bd" stroke-width="2" fill="none" /><text x="145.0" y="140" font-size="16" fill="#342646" text-anchor="middle">Colônia</text><text x="145.0" y="160" font-size="14" fill="#6b5a80" text-anchor="middle">1500-1822</text><rect x="250" y="185" width="120" height="30" fill="#ffe9d6" stroke="#7937bd" stroke-width="1.5"/><path d="M310.0,215 L310.0,230" stroke="#7937bd" stroke-width="2" fill="none" /><text x="310.0" y="260" font-size="16" fill="#342646" text-anchor="middle">Império</text><text x="310.0" y="280" font-size="14" fill="#6b5a80" text-anchor="middle">1822-1889</text><rect x="370" y="185" width="100" height="30" fill="#e3f1ff" stroke="#7937bd" stroke-width="1.5"/><path d="M420.0,170 L420.0,185" stroke="#7937bd" stroke-width="2" fill="none" /><text x="420.0" y="140" font-size="16" fill="#342646" text-anchor="middle">1ª República</text><text x="420.0" y="160" font-size="14" fill="#6b5a80" text-anchor="middle">1889-1930</text><rect x="470" y="185" width="70" height="30" fill="#e8f7e8" stroke="#7937bd" stroke-width="1.5"/><path d="M505.0,215 L505.0,230" stroke="#7937bd" stroke-width="2" fill="none" /><text x="505.0" y="260" font-size="16" fill="#342646" text-anchor="middle">Era Vargas</text><text x="505.0" y="280" font-size="14" fill="#6b5a80" text-anchor="middle">1930-1945</text><rect x="540" y="185" width="60" height="30" fill="#fff6cc" stroke="#7937bd" stroke-width="1.5"/><path d="M570.0,170 L570.0,185" stroke="#7937bd" stroke-width="2" fill="none" /><text x="570.0" y="140" font-size="16" fill="#342646" text-anchor="middle">Rep. 1946</text><text x="570.0" y="160" font-size="14" fill="#6b5a80" text-anchor="middle">1946-1964</text><rect x="600" y="185" width="50" height="30" fill="#ffdede" stroke="#7937bd" stroke-width="1.5"/><path d="M625.0,215 L625.0,230" stroke="#7937bd" stroke-width="2" fill="none" /><text x="625.0" y="260" font-size="16" fill="#342646" text-anchor="middle">Ditadura</text><text x="625.0" y="280" font-size="14" fill="#6b5a80" text-anchor="middle">1964-1985</text><rect x="650" y="185" width="30" height="30" fill="#eee5ff" stroke="#7937bd" stroke-width="1.5"/><path d="M665.0,170 L665.0,185" stroke="#7937bd" stroke-width="2" fill="none" /><text x="665.0" y="140" font-size="16" fill="#342646" text-anchor="middle">Nova Rep.</text><text x="665.0" y="160" font-size="14" fill="#6b5a80" text-anchor="middle">1985-</text><text x="360" y="330" font-size="15" fill="#342646" text-anchor="middle">Marcos: 1808 Corte no Rio · 1888 Abolição · 1937 Estado Novo · 1968 AI-5 · 1988 Constituição</text><text x="360" y="370" font-size="15" fill="#342646" text-anchor="middle">Larguras aproximadas, sem escala exata. Rupturas políticas convivem com continuidades sociais.</text><text x="360" y="405" font-size="15" fill="#342646" text-anchor="middle">Esquema autoral.</text></g></svg>