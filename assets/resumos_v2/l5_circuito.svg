<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img"><title>Duas lâmpadas de 60 ohms em série e em paralelo com fonte de 12 volts</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#7937bd"/></marker></defs><rect width="720" height="440" rx="18" fill="#faf7ff"/><g font-family="sans-serif"><text x="360" y="38" font-size="23" fill="#342646" text-anchor="middle">Série e paralelo com fonte ideal de 12 V</text><rect x="20" y="60" width="330" height="300" rx="12" fill="#ffffff" stroke="#7937bd" stroke-width="2"/><text x="185" y="92" font-size="19" fill="#342646" text-anchor="middle">Série: um só caminho</text><path d="M60,140 L310,140" stroke="#342646" stroke-width="3" fill="none" /><path d="M310,140 L310,300" stroke="#342646" stroke-width="3" fill="none" /><path d="M60,300 L310,300" stroke="#342646" stroke-width="3" fill="none" /><path d="M60,140 L60,195" stroke="#342646" stroke-width="3" fill="none" /><path d="M60,245 L60,300" stroke="#342646" stroke-width="3" fill="none" /><path d="M45,195 L75,195" stroke="#342646" stroke-width="4" fill="none" /><path d="M52,208 L68,208" stroke="#342646" stroke-width="4" fill="none" /><text x="84" y="212" font-size="16" fill="#342646" text-anchor="start">12 V</text><rect x="110" y="128" width="60" height="24" rx="4" fill="#fff" stroke="#342646" stroke-width="3"/><text x="140" y="147" font-size="16" fill="#342646" text-anchor="middle">60 Ω</text><rect x="210" y="128" width="60" height="24" rx="4" fill="#fff" stroke="#342646" stroke-width="3"/><text x="240" y="147" font-size="16" fill="#342646" text-anchor="middle">60 Ω</text><text x="185" y="336" font-size="17" fill="#342646" text-anchor="middle">i = 0,1 A · 6 V em cada</text><rect x="370" y="60" width="330" height="300" rx="12" fill="#ffffff" stroke="#7937bd" stroke-width="2"/><text x="535" y="92" font-size="19" fill="#342646" text-anchor="middle">Paralelo: mesma tensão</text><path d="M410,140 L660,140" stroke="#342646" stroke-width="3" fill="none" /><path d="M410,300 L660,300" stroke="#342646" stroke-width="3" fill="none" /><path d="M410,140 L410,195" stroke="#342646" stroke-width="3" fill="none" /><path d="M410,245 L410,300" stroke="#342646" stroke-width="3" fill="none" /><path d="M395,195 L425,195" stroke="#342646" stroke-width="4" fill="none" /><path d="M402,208 L418,208" stroke="#342646" stroke-width="4" fill="none" /><text x="434" y="212" font-size="16" fill="#342646" text-anchor="start">12 V</text><path d="M530,140 L530,300" stroke="#342646" stroke-width="3" fill="none" /><path d="M640,140 L640,300" stroke="#342646" stroke-width="3" fill="none" /><rect x="500" y="208" width="60" height="24" rx="4" fill="#fff" stroke="#342646" stroke-width="3"/><text x="530" y="227" font-size="16" fill="#342646" text-anchor="middle">60 Ω</text><rect x="610" y="208" width="60" height="24" rx="4" fill="#fff" stroke="#342646" stroke-width="3"/><text x="640" y="227" font-size="16" fill="#342646" text-anchor="middle">60 Ω</text><text x="535" y="336" font-size="17" fill="#342646" text-anchor="middle">0,2 A em cada · 0,4 A total</text><text x="360" y="408" font-size="18" fill="#342646" text-anchor="middle">Valores hipotéticos. Leia nós e caminhos, não a posição dos fios.</text></g></svg>