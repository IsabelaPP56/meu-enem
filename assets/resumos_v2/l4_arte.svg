<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img"><title>Procedimento, contexto e efeito orientam a interpretação artística</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#7937bd"/></marker></defs><rect width="720" height="440" rx="18" fill="#faf7ff"/><g font-family="sans-serif"><text x="145" y="40" font-size="24" fill="#342646">Interpretar uma manifestação artística</text><rect x="35" y="75" width="650" height="88" rx="12" fill="#eee5ff" stroke="#7937bd" stroke-width="2"/><text x="55" y="108" font-size="22" fill="#342646">1 · DESCREVER O PROCEDIMENTO</text><text x="55" y="140" font-size="20" fill="#342646">Material, som, corpo, movimento ou espaço.</text><rect x="35" y="183" width="650" height="88" rx="12" fill="#eee5ff" stroke="#7937bd" stroke-width="2"/><text x="55" y="216" font-size="22" fill="#342646">2 · LER O CONTEXTO</text><text x="55" y="248" font-size="20" fill="#342646">Proposta, sujeitos, circulação e referências.</text><rect x="35" y="291" width="650" height="88" rx="12" fill="#eee5ff" stroke="#7937bd" stroke-width="2"/><text x="55" y="324" font-size="22" fill="#342646">3 · EXPLICAR O EFEITO</text><text x="55" y="356" font-size="20" fill="#342646">Como a escolha constrói sentido aqui?</text><text x="94" y="419" font-size="19" fill="#342646">Evidência antes de gosto pessoal ou intenção presumida.</text></g></svg>