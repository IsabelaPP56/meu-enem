<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img"><title>Oxidação no zinco, redução no cobre e elétrons pelo fio externo</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#7937bd"/></marker></defs><rect width="720" height="440" rx="18" fill="#faf7ff"/><g font-family="sans-serif"><text x="195" y="37" font-size="26" fill="#342646">Pilha galvânica Zn / Cu</text><rect x="60" y="180" width="220" height="180" rx="12" fill="#e9f3ff" stroke="#7937bd" stroke-width="2"/><rect x="440" y="180" width="220" height="180" rx="12" fill="#e9f3ff" stroke="#7937bd" stroke-width="2"/><path d="M170,235V90H550V235" fill="none" stroke="#796c84" stroke-width="6"/><path d="M245,245V150H475V245" fill="none" stroke="#bda5d1" stroke-width="15"/><path d="M285,70 L440,70" stroke="#7937bd" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="320" y="60" font-size="18" fill="#342646">elétrons</text><rect x="147" y="170" width="45" height="150" rx="12" fill="#d5d8de" stroke="#7937bd" stroke-width="2"/><rect x="527" y="170" width="45" height="150" rx="12" fill="#dcaa80" stroke="#7937bd" stroke-width="2"/><text x="82" y="395" font-size="21" fill="#342646">Zn → Zn²⁺ + 2 e⁻</text><text x="445" y="395" font-size="21" fill="#342646">Cu²⁺ + 2 e⁻ → Cu</text><text x="80" y="155" font-size="22" fill="#342646">Ânodo (−)</text><text x="510" y="155" font-size="22" fill="#342646">Cátodo (+)</text><text x="295" y="142" font-size="18" fill="#342646">ponte: íons</text><text x="105" y="345" font-size="18" fill="#342646">Zn²⁺ em solução</text><text x="480" y="345" font-size="18" fill="#342646">Cu²⁺ em solução</text></g></svg>