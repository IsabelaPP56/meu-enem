<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img"><title>Resenha exemplifica gênero, combinação de sequências e diferentes suportes</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#7937bd"/></marker></defs><rect width="720" height="440" rx="18" fill="#faf7ff"/><g font-family="sans-serif"><text x="102" y="40" font-size="23" fill="#342646">Gênero, tipo e suporte: dimensões distintas</text><rect x="35" y="75" width="650" height="88" rx="12" fill="#eee5ff" stroke="#7937bd" stroke-width="2"/><text x="57" y="108" font-size="22" fill="#342646">GÊNERO · o que se faz</text><text x="57" y="140" font-size="21" fill="#342646">Resenha: apresentar e avaliar uma obra</text><rect x="35" y="180" width="650" height="88" rx="12" fill="#eee5ff" stroke="#7937bd" stroke-width="2"/><text x="57" y="213" font-size="22" fill="#342646">TIPOS · como se organiza</text><text x="57" y="245" font-size="21" fill="#342646">Pode combinar descrição e argumentação</text><rect x="35" y="285" width="650" height="88" rx="12" fill="#eee5ff" stroke="#7937bd" stroke-width="2"/><text x="57" y="318" font-size="22" fill="#342646">SUPORTE · onde circula</text><text x="57" y="350" font-size="21" fill="#342646">Pode ser publicada em jornal ou plataforma</text><text x="76" y="416" font-size="20" fill="#342646">Assunto comum não implica finalidade ou gênero iguais.</text></g></svg>