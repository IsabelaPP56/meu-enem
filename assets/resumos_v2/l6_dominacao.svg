<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img"><title>Três tipos de dominação legítima segundo Max Weber</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="#7937bd"/></marker></defs><rect width="720" height="440" rx="18" fill="#faf7ff"/><g font-family="sans-serif"><text x="360" y="38" font-size="23" fill="#342646" text-anchor="middle">Weber: três tipos puros de dominação legítima</text><rect x="30" y="80" width="204" height="210" rx="12" fill="#ffffff" stroke="#7937bd" stroke-width="2"/><text x="132" y="118" font-size="20" fill="#7937bd" text-anchor="middle">Tradicional</text><text x="132" y="175" font-size="13" fill="#342646" text-anchor="middle">obedece-se ao costume</text><text x="132" y="240" font-size="13" fill="#6b5a80" text-anchor="middle">ex.: patriarca, monarca hereditário</text><rect x="258" y="80" width="204" height="210" rx="12" fill="#ffffff" stroke="#7937bd" stroke-width="2"/><text x="360" y="118" font-size="20" fill="#7937bd" text-anchor="middle">Carismática</text><text x="360" y="175" font-size="13" fill="#342646" text-anchor="middle">obedece-se a dons do líder</text><text x="360" y="240" font-size="13" fill="#6b5a80" text-anchor="middle">ex.: profeta, líder revolucionário</text><rect x="486" y="80" width="204" height="210" rx="12" fill="#ffffff" stroke="#7937bd" stroke-width="2"/><text x="588" y="118" font-size="20" fill="#7937bd" text-anchor="middle">Racional-legal</text><text x="588" y="175" font-size="13" fill="#342646" text-anchor="middle">obedece-se à regra impessoal</text><text x="588" y="240" font-size="13" fill="#6b5a80" text-anchor="middle">ex.: burocracia, Estado moderno</text><text x="360" y="340" font-size="17" fill="#342646" text-anchor="middle">Tipos ideais: casos reais costumam misturar elementos.</text><text x="360" y="375" font-size="17" fill="#342646" text-anchor="middle">Pergunte: qual é a fonte da legitimidade?</text><text x="360" y="410" font-size="15" fill="#342646" text-anchor="middle">Esquema autoral.</text></g></svg>